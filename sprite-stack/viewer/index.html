<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Sprite Stack Rogue Archer — Animations Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #3e4148; color: #eceef4; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: grab; }
  #ui { position: fixed; top: 12px; left: 12px; background: #131223eb; padding: 12px 14px; border-radius: 10px; width: 265px; border: 2px solid #dfa528; }
  #ui label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; }
  #ui input[type=range] { width: 125px; }
  #ui b { color: #fae04b; font-size: 14px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 8px 0; }
  .btns button { padding: 6px 4px; border: 1px solid #434756; border-radius: 6px; background: #292b37; color: #eceef4; font-weight: 700; cursor: pointer; }
  .btns button.active { background: #dfa528; color: #131223; border-color: #fae04b; }
  #dropBtn { width: 100%; margin-top: 6px; padding: 6px 10px; border: 0; border-radius: 6px; background: #434756; color: #fff; font-weight: 600; cursor: pointer; }
  #dropBtn:hover { background: #656a78; }
  #hint { opacity: .75; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b>Sprite Stacking — Rogue Archer</b>
  <div class="btns">
    <button id="btn_idle">Idle</button>
    <button id="btn_run" class="active">Бег</button>
    <button id="btn_shoot">Выстрел</button>
  </div>
  <label>Авто-поворот <input type="checkbox" id="auto" checked></label>
  <label>Угол <input type="range" id="angle" min="0" max="360" value="35"></label>
  <label>Скорость аним. <input type="range" id="fps" min="4" max="18" value="10"></label>
  <label>Наклон камеры <input type="range" id="tilt" min="40" max="100" value="65"></label>
  <label>Шаг слоя (px) <input type="range" id="spacing" min="50" max="220" value="100"></label>
  <label>Масштаб <input type="range" id="zoom" min="3" max="10" value="6"></label>
  <label>Контур <input type="checkbox" id="outline" checked></label>
  <button id="dropBtn">Собрать слои заново</button>
  <div id="hint">Тяни мышью или Q/E — крутить.<br>1/2/3 — переключить Idle / Бег / Выстрел.</div>
</div>

};

let curAnim = 'run', loaded = 0, angle = 35 * Math.PI / 180, drag = null, dropStart = -9999;
let frameIdx = 0, lastFrameTs = 0, scrollOff = 0;

for (const key of Object.keys(DATA)) {
  const img = new Image();
  img.onload = () => {
    const t = document.createElement('canvas');
    t.width = img.width; t.height = img.height;
    const tc = t.getContext('2d');
    tc.drawImage(img, 0, 0);
    tc.globalCompositeOperation = 'source-in';
    tc.fillStyle = OUTLINE; tc.fillRect(0, 0, t.width, t.height);
    DATA[key].img = img; DATA[key].tinted = t;
    if (++loaded === 3) requestAnimationFrame(loop);
  };
  img.src = DATA[key].src;
}

function setAnim(name) {
  curAnim = name; frameIdx = 0; lastFrameTs = performance.now();
  for (const k of ['idle','run','shoot']) $('btn_' + k).classList.toggle('active', k === name);
}
for (const k of ['idle','run','shoot']) $('btn_' + k).onclick = () => setAnim(k);

function drawStack(g, img, row, x, y, rot, tilt, spacing, dropT) {
  const sy = row * SLICE;
  for (let i = 0; i < NSLICES; i++) {
    let lift = 0;
    if (dropT < 1) {
      const t0 = (i / NSLICES) * 0.65, t1 = t0 + 0.35;
      if (dropT < t0) continue;
      const u = Math.min(1, (dropT - t0) / (t1 - t0));
      lift = (1 - (1 - Math.pow(1 - u, 3))) * 26;
    }
    g.save();
    g.translate(Math.round(x), Math.round(y - i * spacing - lift));
    g.scale(1, tilt);
    g.rotate(rot);
    g.drawImage(img, i * SLICE, sy, SLICE, SLICE, -SLICE / 2, -SLICE / 2, SLICE, SLICE);
    g.restore();
  }
}

function loop(ts) {
  const zoom = +$('zoom').value;
  const tilt = $('tilt').value / 100, spacing = $('spacing').value / 100;
  const dropT = Math.min(1, (ts - dropStart) / 1400);
  const anim = DATA[curAnim];
  const speedMul = 10 / (+$('fps').value);
  if (ts - lastFrameTs >= anim.durs[frameIdx] * speedMul) {
    frameIdx = (frameIdx + 1) % anim.frames;
    lastFrameTs = ts;
  }
  if (curAnim === 'run') scrollOff = (scrollOff + 0.65 * (+$('fps').value / 10)) % 16;

  if ($('auto').checked && !drag) { angle += 0.008; $('angle').value = Math.round(((angle * 180 / Math.PI) % 360 + 360) % 360); }
  else angle = $('angle').value * Math.PI / 180;

  cv.width = innerWidth; cv.height = innerHeight;
  low.width = Math.ceil(cv.width / zoom); low.height = Math.ceil(cv.height / zoom);
  const g = lctx, W = low.width, H = low.height;
  g.imageSmoothingEnabled = false;
  g.fillStyle = BG; g.fillRect(0, 0, W, H);

  const cx = Math.round(W / 2), cy = Math.round(H / 2 + 12);
  const ca = Math.cos(-angle), sa = Math.sin(-angle);
  // Floor markers scroll backward under her feet when running!
  g.fillStyle = TILE;
  for (let gx = -128; gx <= 128; gx += 16) {
    for (let gy = -128; gy <= 128; gy += 16) {
      const wy = gy + (curAnim === 'run' ? scrollOff : 0);
      const px = Math.round(cx + (gx * ca - wy * sa));
      const py = Math.round(cy + (gx * sa + wy * ca) * tilt);
      g.fillRect(px, py, 2, 1);
    }
  }

  g.fillStyle = SHADOW;
  const rx = 11, ry = Math.max(1, Math.round(11 * tilt));
  for (let dy = -ry; dy <= ry; dy++) {
    const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    g.fillRect(cx - dx, cy + 1 + dy, dx * 2 + 1, 1);
  }

  const rot = -angle;
  if ($('outline').checked) {
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]])
      drawStack(g, anim.tinted, frameIdx, cx + dx, cy + dy, rot, tilt, spacing, dropT);
  }
  drawStack(g, anim.img, frameIdx, cx, cy, rot, tilt, spacing, dropT);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, low.width * zoom, low.height * zoom);
  requestAnimationFrame(loop);
}

$('dropBtn').onclick = () => { dropStart = performance.now(); };
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, a: angle }; $('auto').checked = false; cv.style.cursor = 'grabbing'; });
addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'grab'; });
addEventListener('pointermove', e => { if (!drag) return; angle = drag.a + (e.clientX - drag.x) * 0.012; $('angle').value = Math.round(((angle * 180 / Math.PI) % 360 + 360) % 360); });
addEventListener('keydown', e => {
  if (e.key === '1') setAnim('idle');
  if (e.key === '2') setAnim('run');
  if (e.key === '3') setAnim('shoot');
  if (e.key === 'q' || e.key === 'e') { $('auto').checked = false; angle += e.key === 'q' ? -0.06 : 0.06; $('angle').value = Math.round(((angle * 180 / Math.PI) % 360 + 360) % 360); }
});
